[package]
name = "network-toolkit"
version = "0.1.0"
edition = "2021"

[lib]
name = "network_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pcap = "2"
etherparse = "0.17"
maxminddb = "0.24"
ureq = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
