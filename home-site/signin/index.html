<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Sign in &mdash; EqNetwork</title>
  <meta name="description" content="Sign in to your EqNetwork account to view your IP Storage, filters and account." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/account/styles.css" />
</head>
<body>
  <div class="auth-shell" data-reveal>
    <div class="auth-pitch reveal">
      <h1 data-mask-lines>Same account.<br />Every computer.</h1>
      <p class="auth-lead">Sign in to see the IP Storage and filters you saved in the app, from any browser.</p>
      <div class="auth-points">
        <div class="auth-point">
          <strong>Synced</strong>
          <span>IP Storage and filters follow your account, not the machine.</span>
        </div>
        <div class="auth-point">
          <strong>Read-only here</strong>
          <span>This page only shows your data &mdash; changes still happen in the app.</span>
        </div>
      </div>
    </div>
    <div class="auth-card-wrap">
      <form class="login-card reveal" id="login-form" novalidate>
        <p class="error-text" id="login-error" role="alert" hidden></p>
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn" type="submit" id="login-submit">Sign in</button>
        <p class="hint">New here? <a href="/signup">Create an account</a>.</p>
      </form>
    </div>
  </div>
  <script src="/reveal.js"></script>
  <script src="/signin/app.js"></script>
</body>
</html>
