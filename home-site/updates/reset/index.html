<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Reset your EqNetwork password</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --text:#e8ecf1; --muted:#9aa5b4; --line:#2a313c; --accent:#ff7a2f; --bad:#ff6b6b; --good:#5fd38d; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f5f7; --card:#fff; --text:#15181d; --muted:#586272; --line:#d5dae1; --bad:#c62828; --good:#1b7f45; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, "Segoe UI", sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 16px; font-size:.9rem; }
  label { display:block; font-size:.85rem; margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; font:inherit; color:var(--text); background:transparent; border:1px solid var(--line); border-radius:8px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { width:100%; margin-top:18px; padding:11px; font:inherit; font-weight:600; color:#1a1208; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #msg { margin-top:14px; min-height:1.4em; font-size:.9rem; }
  .bad { color:var(--bad); } .good { color:var(--good); }
</style>
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  <p>For your EqNetwork account. After saving, sign in again in the app with your username.</p>
  <form id="f" novalidate>
    <label for="p1">New password</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="p2">Confirm new password</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="go" type="submit">Save password</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
  var URL_ = "https://bswzptrmeeobbnthjioz.supabase.co";
  var KEY = "sb_publishable_efMWSpsdDD8crieaCVSlow_PGXONxdi";
  var hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  var token = hash.get("access_token");
  var msg = document.getElementById("msg");
  var go = document.getElementById("go");
  function say(t, cls) { msg.textContent = t; msg.className = cls || ""; }
  if (!token) {
    say(hash.get("error_description") || "This link is missing or has expired. Request a new reset email from the app.", "bad");
    go.disabled = true;
  }
  history.replaceState(null, "", location.pathname);
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var a = document.getElementById("p1").value, b = document.getElementById("p2").value;
    if (a.length < 8) return say("The password needs at least 8 characters.", "bad");
    if (a !== b) return say("The two passwords do not match.", "bad");
    go.disabled = true; say("Saving...");
    fetch(URL_ + "/auth/v1/user", {
      method: "PUT",
      headers: { apikey: KEY, Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ password: a })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.ok) { say("Password changed. You can close this page and sign in in the app.", "good"); }
        else { say(j.msg || j.message || "Could not change the password. The link may have expired.", "bad"); go.disabled = false; }
      });
    }).catch(function () { say("Could not reach the server.", "bad"); go.disabled = false; });
  });
</script>
</body>
</html>
